name: Rozy POS CI

on:
  push:
    branches: [main, "hardening/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
      - name: Lint critical modules changed in Phase 1
        run: npx eslint src/lib/billing.js src/lib/inventory.js src/lib/inventoryRules.js src/lib/products.js src/lib/customers.js src/lib/syncEngine.js src/lib/backup.js src/lib/backupRules.js src/lib/db.js src/screens/Orders.jsx src/screens/Customers.jsx src/stores/inventoryStore.js src/stores/syncStore.js money-rules.test.js inventory-rules.test.js backup-rules.test.js
      - name: Full-project lint baseline (known debt)
        run: npm run lint
        continue-on-error: true
      - name: Build production bundle
        run: npm run build
