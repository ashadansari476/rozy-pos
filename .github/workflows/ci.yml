name: Rozy POS Main CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run existing unit tests (known baseline failures)
        run: npm test
        continue-on-error: true
      - name: Report existing lint debt (non-blocking)
        run: npm run lint
        continue-on-error: true
      - name: Build production bundle
        run: npm run build
